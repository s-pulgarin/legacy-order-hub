[tool.black]
line-length = 88
target-version = ["py311"]
# database.py es el módulo legado que se conserva solo como referencia.
extend-exclude = '''
^/database\.py
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["orderhub", "config"]

[tool.coverage.report]
# RNF-01.2: cobertura mínima del 80 %; por debajo, pytest (y el CI) fallan.
fail_under = 80
skip_empty = true
