# Blueprint de Render (infraestructura como código).
# Render lee este archivo desde la rama main y crea, conectados entre sí:
#   - orderhub        web service con nuestro Dockerfile (gunicorn, /healthcheck)
#   - orderhub-db     PostgreSQL administrado
#   - orderhub-redis  Key Value (compatible con Redis) para las notificaciones
# Todo en el plan gratuito y en la misma región (las conexiones internas lo exigen).
# Ver docs/RENDER_DEPLOYMENT.md.

services:
  - type: web
    name: orderhub
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthcheck
    autoDeploy: true # cada merge a main despliega una versión nueva
    envVars:
      # Render genera una clave aleatoria: nunca está en el código (RNF-02.1).
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: orderhub-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: orderhub-redis
          property: connectionString
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      # Contraseñas de los usuarios semilla "admin" y "juan": Render las pide
      # al crear el Blueprint (sync: false = no se guardan en este archivo).
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_CLIENT_PASSWORD
        sync: false

  - type: keyvalue
    name: orderhub-redis
    plan: free
    region: virginia
    ipAllowList: [] # solo accesible desde servicios de esta cuenta

databases:
  - name: orderhub-db
    plan: free
    region: virginia
    databaseName: orderhub
    user: orderhub
