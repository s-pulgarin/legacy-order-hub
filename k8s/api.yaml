# API de OrderHub (RNF-03.3): Deployment con sondas en /healthcheck + Service.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: orderhub
  labels:
    app.kubernetes.io/name: orderhub-api
    app.kubernetes.io/part-of: orderhub
spec:
  type: NodePort # en Minikube: `minikube service api -n orderhub --url`
  selector:
    app.kubernetes.io/name: orderhub-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: orderhub
  labels:
    app.kubernetes.io/name: orderhub-api
    app.kubernetes.io/part-of: orderhub
spec:
  replicas: 2 # el HPA lo ajusta entre 2 y 5
  selector:
    matchLabels:
      app.kubernetes.io/name: orderhub-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # actualizaciones sin caída de servicio
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderhub-api
        app.kubernetes.io/part-of: orderhub
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Espera a que PostgreSQL acepte conexiones antes de arrancar la API
        # (sin esto la API falla al resolver "db" y Kubernetes la reinicia).
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            ["sh", "-c", "until pg_isready -h db -p 5432 -U orderhub; do echo esperando db; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: api
          image: orderhub:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: orderhub-config }
            - secretRef: { name: orderhub-secrets }
          env:
            # $(VAR) se expande con las variables ya definidas (Secret/ConfigMap).
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)"
          readinessProbe: # ¿puede recibir tráfico?
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe: # ¿sigue vivo? si no, se reinicia
            httpGet: { path: /healthcheck, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # El HPA calcula el % de CPU sobre el "request".
            # Memoria: Argon2 usa 64 MiB por verificación de contraseña (es
            # "memory-hard" a propósito). Con 4 hilos de gunicorn son ~256 MiB
            # más la app; con un límite de 256Mi el pod moría por OOMKilled
            # bajo carga de logins (detectado en la prueba del HPA).
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
