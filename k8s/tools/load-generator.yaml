# Generador de carga para demostrar el HPA (no forma parte del despliegue).
#
#   kubectl apply -f k8s/tools/load-generator.yaml     # empieza la carga
#   kubectl -n orderhub get hpa api --watch            # ver cómo escala
#   kubectl delete -f k8s/tools/load-generator.yaml    # detiene la carga
#
# Lanza 6 bucles en paralelo contra POST /login con una contraseña incorrecta:
# cada intento verifica un hash Argon2, que consume CPU a propósito.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: orderhub
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/part-of: orderhub
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: load
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          for i in 1 2 3 4 5 6; do
            (while true; do
              wget -q -O /dev/null --header 'Content-Type: application/json' \
                --post-data '{"username":"juan","password":"incorrecta"}' \
                http://api:8000/login 2>/dev/null
            done) &
          done
          wait
      resources:
        requests: { cpu: 50m, memory: 16Mi }
        limits: { cpu: 200m, memory: 32Mi }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
